<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invasons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1233; --deep:#120b22; --ink:#f6f0ff; --muted:#bfb0de; --slime:#9be15d; --pink:#ff7ab6;
  --wkey:#fbf8ff; --bkey:#2b2340; --ok:#b8f28c; --bad:#ff9a9a; --reveal:#ffd76a; --chip:#2f2350;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1c1233; --deep:#120b22; } }
:root[data-theme="dark"]{ --bg:#1c1233; --deep:#120b22; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--deep);}
.brand{font-family:'Creepster','Fredoka',cursive;font-size:22px;color:var(--slime);letter-spacing:1px;line-height:1;}
.stats{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;flex:1;justify-content:flex-end;}
#keyChip{background:var(--chip);border-radius:8px;padding:3px 8px;font-size:14px;}
#lives{color:var(--pink);letter-spacing:2px;}
@media (max-width:460px){ body.ingame .brand{display:none;} .stats{justify-content:flex-start;} }
body.ingame .menuonly, body:not(.ingame) .gameonly{display:none!important;}
.spacer{flex:1;}
.flagbtn{padding:0 6px;}.flagbtn svg{width:30px;height:20px;border-radius:3px;display:block;}
#langPop{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:20;background:var(--deep);border:1px solid #3a2e5c;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;}
#langPop.hidden{display:none;}
#langPop button{display:flex;align-items:center;gap:10px;background:none;border:2px solid transparent;border-radius:8px;color:var(--ink);font:600 15px 'Fredoka',system-ui,sans-serif;padding:4px 8px;cursor:pointer;}
#langPop button.on{border-color:var(--slime);}
#langPop svg{width:30px;height:20px;border-radius:3px;}
.cards{display:grid;gap:8px;text-align:left;}
.card{display:flex;align-items:center;gap:12px;background:var(--chip);border:2px solid transparent;border-radius:14px;padding:10px 12px;color:var(--ink);font:600 17px 'Fredoka',system-ui,sans-serif;cursor:pointer;text-align:left;}
.card .ic{font-size:28px;line-height:1;}
.card small{display:block;color:var(--muted);font-weight:400;font-size:13px;}
.card:disabled{opacity:.45;cursor:default;}
.card:not(:disabled):active{border-color:var(--slime);}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.top h2{margin:0;font-size:20px;flex:1;text-align:left;}
.back{background:var(--chip);color:var(--ink);border:none;border-radius:10px;width:38px;height:34px;font:700 18px 'Fredoka',system-ui,sans-serif;cursor:pointer;}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:thin;}
.strip .tbtn{flex:0 0 74px;scroll-snap-align:start;}
.lvlrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.lvlrow button{background:var(--chip);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:7px 0;font:700 16px 'Fredoka',system-ui,sans-serif;cursor:pointer;}
.lvlrow button.on{border-color:var(--slime);background:#35285c;}
.desc{color:var(--muted);font-size:13px;margin:6px 0 0;}
.row{margin:0 0 14px;}
.vol{width:100%;accent-color:var(--slime);}
.hbtn{background:var(--chip);color:var(--ink);border:none;border-radius:10px;height:34px;min-width:38px;padding:0 9px;font:600 14px 'Fredoka',system-ui,sans-serif;cursor:pointer;}
button:focus-visible,select:focus-visible{outline:3px solid var(--slime);outline-offset:2px;}
main{position:relative;flex:1;min-height:0;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#overlay{position:absolute;inset:0;background:rgba(18,11,34,.88);display:flex;justify-content:center;overflow-y:auto;padding:16px;}
#overlay.hidden{display:none;}
.panel{max-width:440px;width:100%;text-align:center;margin:auto;}
.big{font-family:'Creepster','Fredoka',cursive;font-size:clamp(46px,13vw,72px);color:var(--slime);line-height:1;margin:4px 0 8px;text-shadow:0 4px 0 #3c6b1f;}
.sub{color:var(--muted);font-size:16px;line-height:1.4;margin:0 0 14px;}
.flags{display:flex;justify-content:center;gap:10px;margin-bottom:14px;}
.flag{border:3px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;line-height:0;}
.flag svg{width:42px;height:28px;border-radius:5px;display:block;}
.flag.on{border-color:var(--slime);}
.row{text-align:left;margin:0 0 12px;}
.label{color:var(--muted);font-size:14px;margin:0 0 6px;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button,.lvl{flex:1;background:var(--chip);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:8px 6px;font:600 15px 'Fredoka',system-ui,sans-serif;cursor:pointer;min-width:0;}
.seg button.on,.lvl.on{border-color:var(--slime);background:#35285c;}
.seg select{flex:1;background:var(--chip);color:var(--ink);border:2px solid #4a3a75;border-radius:12px;padding:8px;font:600 15px 'Fredoka',system-ui,sans-serif;min-width:0;}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.tbtn{background:var(--chip);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:6px 4px;font:600 13px 'Fredoka',system-ui,sans-serif;cursor:pointer;line-height:1.15;}
.tbtn span{display:block;font-size:24px;line-height:1.2;}
.tbtn.on{border-color:var(--slime);background:#35285c;}
.lvlgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.lvl small{display:block;color:var(--muted);font-weight:400;font-size:13px;}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:15px;margin:2px 0 16px;cursor:pointer;}
.toggle input{width:20px;height:20px;accent-color:var(--slime);}
.play{background:var(--slime);color:#1e3a0c;border:none;border-radius:16px;padding:14px 36px;font:700 22px 'Fredoka',system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 #4f8a26;}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #4f8a26;}
.ghost{background:none;color:var(--muted);border:none;font:600 16px 'Fredoka',system-ui,sans-serif;margin-top:12px;cursor:pointer;padding:8px;}
.hint{color:var(--muted);font-size:13px;margin-top:14px;line-height:1.4;}
.score{font-size:44px;font-weight:700;margin:4px 0;}
#kb{position:relative;height:clamp(120px,24vh,180px);display:flex;gap:3px;padding:6px;background:var(--deep);}
#kb.nonames .lab{visibility:hidden;}
.key{border:none;cursor:pointer;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;display:flex;align-items:flex-end;justify-content:center;text-align:center;line-height:1.05;transition:transform .05s;touch-action:none;padding:0;}
.key .lab i{font-style:normal;}
.key.white{flex:1;min-width:0;background:var(--wkey);color:#3a2e5c;border-radius:0 0 9px 9px;padding-bottom:9px;font-size:clamp(12px,3.4vw,17px);box-shadow:inset 0 -6px 0 #d9d0ee;}
.key.black{position:absolute;top:6px;height:58%;transform:translateX(-50%);background:var(--bkey);color:#efe9ff;border:2px solid var(--deep);border-top:none;border-radius:0 0 7px 7px;z-index:2;padding-bottom:5px;font-size:clamp(9px,2.3vw,13px);box-shadow:inset 0 -5px 0 #171127;}
.key.black .lab i{display:block;}
#kb.two .key.white{font-size:clamp(9px,2.5vw,14px);padding-bottom:6px;border-radius:0 0 6px 6px;}
#kb.two .key.black{font-size:clamp(7px,1.9vw,11px);padding-bottom:3px;}
.key.white.down{transform:translateY(2px);}
.key.black.down{transform:translateX(-50%) translateY(2px);}
.key.white.off{background:#b9afcf;color:#6f6590;box-shadow:none;pointer-events:none;}
.key.black.off{background:#4c4366;color:#958bb0;box-shadow:none;pointer-events:none;}
.key.ok{background:var(--ok)!important;color:#1e3a0c!important;}
.key.bad{background:var(--bad)!important;color:#5a1010!important;}
.key.reveal{background:var(--reveal)!important;color:#4a3300!important;}
#kb.ivmode{display:flex;flex-direction:column;gap:8px;padding:8px;}
.ivz{display:grid;gap:6px;min-height:0;}
.ivn{flex:1.15;grid-template-columns:repeat(7,1fr);}
.ivs{flex:1;grid-template-columns:repeat(5,1fr);padding-top:8px;border-top:2px dashed #3a2e5c;}
.ivs .ib{color:#6c5ce7;}
.ib.sel{background:#d9cdff;box-shadow:inset 0 0 0 3px #6c5ce7;}
.ib{border:none;border-radius:12px;background:var(--wkey);color:#3a2e5c;font:700 clamp(16px,4.6vw,22px) 'Fredoka',system-ui,sans-serif;cursor:pointer;box-shadow:inset 0 -5px 0 #d9d0ee;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0;min-width:0;}
.ib i{font-style:normal;font-size:.8em;color:#6c5ce7;}
.ib.down{transform:translateY(2px);}
.ib.off{background:#b9afcf;color:#6f6590;box-shadow:none;pointer-events:none;}
.ib.ok{background:var(--ok);}.ib.bad{background:var(--bad);}.ib.reveal{background:var(--reveal);}
@media (prefers-reduced-motion: reduce){ .key{transition:none;} }
</style>
</head>

function update(dt){
  const gy=groundY();
  st.spawnT-=dt;if(st.spawnT<=0&&active().length<maxAlive()){spawn();st.spawnT=spawnGap();}
  const v=gy*0.72/travelTime();
  for(const e of st.ens){
    e.t+=dt;const p=clamp01(e.y/gy);
    if(e.state==='spawn'){if(e.t>=SPAWN_T){e.state='walk';e.t=0;sing(e);}}
    else if(e.state==='walk'){e.phase+=dt*6;e.y+=v*(0.75+0.5*p)*dt;if(e.y>=gy){e.y=gy;if(!e.targeted)reach(e);}}
    else if(e.state==='done'){const d=DONE[e.type];
      if(d.leave!==undefined&&e.t>d.leave){e.leaving=true;e.phase+=dt*8;e.ox+=e.dir*W*(d.speed||0.45)*dt;}
      if(e.t>d.fade)e.alpha=Math.max(0,1-(e.t-d.fade)/(d.fd||0.6));
    }else if(e.state==='gone'){e.alpha=Math.max(0,1-e.t/0.7);}
  }
  st.ens=st.ens.filter(e=>e.alpha>0.01);
  for(const s of st.shots){s.t+=dt/0.24;if(s.t>=1&&s.e.state==='walk')hit(s.e);}
  st.shots=st.shots.filter(s=>s.t<1);
  for(const f of st.fx){f.t+=dt;if(f.part){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=f.g*dt;f.rot+=f.vr*dt;}}st.fx=st.fx.filter(f=>f.t<f.life);
  for(const m of st.marks)m.t+=dt;st.marks=st.marks.filter(m=>m.t<m.life);
  if(st.banner){st.banner.t+=dt;if(st.banner.t>2.2)st.banner=null;}
  st.shake=Math.max(0,st.shake-dt);
}

  ctx.fillStyle=w.f[1];
  for(let r=0;r<ys.length-1;r++)for(let c=-cols;c<cols;c++){

  ctx.fillStyle='#2b2340';tri(hx-hr*0.08,hy+hr*0.5,hx+hr*0.08,hy+hr*0.5,hx,hy+hr*0.36);
  ctx.strokeStyle='#2b2340';ctx.lineWidth=Math.max(1,hr*0.05);line(hx-hr*0.3,hy+hr*0.74,hx+hr*0.3,hy+hr*0.74);for(let i=-2;i<=2;i++)line(hx+i*hr*0.12,hy+hr*0.66,hx+i*hr*0.12,hy+hr*0.82);
}
function drawDino(e,x,y,s,by,hx,hy,hr){
  const sk='#ff9f5a',done=e.state==='done',tw=Math.sin(e.phase*0.5)*s*0.05;
  ctx.fillStyle=sk;ctx.beginPath();ctx.moveTo(x-s*0.15,by-s*0.05);ctx.quadraticCurveTo(x+s*0.2,by-s*0.4,x+s*0.47+tw,by-s*0.58);ctx.quadraticCurveTo(x+s*0.25,by-s*0.25,x+s*0.15,by+s*0.05);ctx.closePath();ctx.fill();
  ell(x,by,s*0.29,s*0.25);ctx.fill();ctx.fillStyle='#ffd98a';ell(x,by+s*0.03,s*0.17,s*0.17);ctx.fill();
  ctx.strokeStyle=sk;ctx.lineWidth=s*0.07;line(x-s*0.15,by-s*0.08,x-s*0.12,by+s*0.03);line(x+s*0.15,by-s*0.08,x+s*0.12,by+s*0.03);
  ctx.fillStyle='#e0603a';for(let i=-1;i<=1;i++)tri(hx+i*hr*0.45-hr*0.18,hy-hr*0.7,hx+i*hr*0.45,hy-hr*1.15-(i===0?hr*0.15:0),hx+i*hr*0.45+hr*0.18,hy-hr*0.7);
  ctx.fillStyle=sk;ell(hx,hy,hr*1.12,hr*0.95);ctx.fill();ctx.save();ell(hx,hy,hr*1.12,hr*0.95);ctx.clip();ctx.fillStyle='#f28a40';ell(hx,hy-hr*0.65,hr*1.2,hr*0.5);ctx.fill();ctx.restore();
  ctx.fillStyle='#ffb57a';ell(hx,hy+hr*0.45,hr*0.72,hr*0.4);ctx.fill();
  ctx.fillStyle='#7a3a1a';circle(hx-hr*0.15,hy+hr*0.3,hr*0.05);ctx.fill();circle(hx+hr*0.15,hy+hr*0.3,hr*0.05);ctx.fill();
  if(done){ctx.strokeStyle='#2b2340';ctx.lineWidth=Math.max(1.5,hr*0.08);ctx.beginPath();ctx.arc(hx-hr*0.5,hy-hr*0.02,hr*0.13,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(hx+hr*0.5,hy-hr*0.02,hr*0.13,0,Math.PI);ctx.stroke();}
  else{ctx.fillStyle='#fff';circle(hx-hr*0.5,hy-hr*0.02,hr*0.19);ctx.fill();circle(hx+hr*0.5,hy-hr*0.02,hr*0.19);ctx.fill();ctx.fillStyle='#2b2340';circle(hx-hr*0.47,hy,hr*0.09);ctx.fill();circle(hx+hr*0.47,hy,hr*0.09);ctx.fill();}
  ctx.strokeStyle='#7a3a1a';ctx.lineWidth=Math.max(1.5,hr*0.07);ctx.beginPath();ctx.arc(hx,hy+hr*0.45,hr*0.35,0.2*Math.PI,0.8*Math.PI);ctx.stroke();
  ctx.fillStyle='#fff';tri(hx-hr*0.18,hy+hr*0.72,hx-hr*0.08,hy+hr*0.74,hx-hr*0.13,hy+hr*0.86);tri(hx+hr*0.18,hy+hr*0.72,hx+hr*0.08,hy+hr*0.74,hx+hr*0.13,hy+hr*0.86);
}
function drawShot(x,y,t,type){
  const s=SZ;ctx.save();ctx.translate(x,y);
  if(type==='brain'){ctx.rotate(t*4);ctx.fillStyle='#ff8fb8';ell(0,0,s*0.17,s*0.13);ctx.fill();ctx.strokeStyle='#e0628f';ctx.lineWidth=2;line(0,-s*0.12,0,s*0.12);
    ctx.beginPath();ctx.arc(-s*0.08,-s*0.03,s*0.05,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(s*0.08,s*0.03,s*0.05,Math.PI,0);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.5)';circle(-s*0.07,-s*0.06,s*0.03);ctx.fill();}
  else if(type==='garlic'){ctx.rotate(t*7);ctx.fillStyle='#f7f2e8';ell(0,0,s*0.16,s*0.14);ctx.fill();tri(-s*0.05,-s*0.1,0,-s*0.25,s*0.05,-s*0.1);
    ctx.strokeStyle='#cfc2aa';ctx.lineWidth=2;line(0,-s*0.12,0,s*0.12);line(-s*0.08,-s*0.09,-s*0.08,s*0.09);line(s*0.08,-s*0.09,s*0.08,s*0.09);}
  else if(type==='slipper')drawSlipper(0,0,s,t*9);
  else if(type==='ball')beachBall(0,0,s*0.15,t*8);
  else if(type==='flash'){ctx.rotate(Math.sin(t*12)*0.3);ctx.fillStyle='#2b2340';rr(-s*0.16,-s*0.1,s*0.32,s*0.2,s*0.04);ctx.fill();ctx.fillStyle='#4a3f66';ctx.fillRect(-s*0.06,-s*0.14,s*0.12,s*0.05);
    ctx.fillStyle='#9ad7ff';circle(0,0,s*0.07);ctx.fill();ctx.fillStyle='#fffbe0';circle(s*0.11,-s*0.06,s*0.03);ctx.fill();}
  else if(type==='duster'){ctx.rotate(t*6);ctx.strokeStyle='#8a5a32';ctx.lineWidth=s*0.04;line(0,0,0,s*0.25);['#ff7ab6','#ffd23f','#7ec8e3','#9be15d'].forEach((c,i)=>{ctx.fillStyle=c;circle(Math.cos(i*1.6)*s*0.07,-s*0.06+Math.sin(i*1.6)*s*0.05,s*0.08);ctx.fill();});}
  else if(type==='orb'){ctx.shadowColor='#7bf0b0';ctx.shadowBlur=20;ctx.fillStyle='#c9ffe6';circle(0,0,s*0.12);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#7bf0b0';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,s*0.2,s*0.07,t*6,0,Math.PI*2);ctx.stroke();}
  else if(type==='cannon'){ctx.fillStyle='#1d1a2a';circle(0,0,s*0.12);ctx.fill();ctx.fillStyle='rgba(255,255,255,.3)';circle(-s*0.04,-s*0.04,s*0.04);ctx.fill();ctx.fillStyle='#ffd23f';circle(s*0.1,-s*0.1,s*0.03+Math.random()*s*0.02);ctx.fill();}
  else if(type==='oil'){ctx.rotate(Math.sin(t*10)*0.4);ctx.fillStyle='#d9a441';rr(-s*0.1,-s*0.06,s*0.2,s*0.16,s*0.03);ctx.fill();ctx.strokeStyle='#b0822a';ctx.lineWidth=s*0.03;line(s*0.08,-s*0.02,s*0.22,-s*0.14);ctx.fillStyle='#3a3020';circle(s*0.23,-s*0.1,s*0.025);ctx.fill();}
  else if(type==='milk'){ctx.rotate(t*5);ctx.fillStyle='#fff';rr(-s*0.08,-s*0.13,s*0.16,s*0.26,s*0.03);ctx.fill();ctx.fillStyle='#7ec8e3';ctx.fillRect(-s*0.08,-s*0.02,s*0.16,s*0.05);}
  else if(type==='broccoli'){ctx.rotate(t*5);ctx.fillStyle='#9be15d';ctx.fillRect(-s*0.03,0,s*0.06,s*0.16);ctx.fillStyle='#3f9b3a';[[-0.07,-0.02],[0.07,-0.02],[0,-0.09],[-0.04,-0.12],[0.05,-0.12]].forEach(([a,b])=>{circle(a*s,b*s,s*0.07);ctx.fill();});}
  ctx.restore();
}
function part(x,y,vx,vy,txt,col,life,grav){st.fx.push({part:true,x,y,vx,vy,txt,col,t:0,life,g:grav?SZ*7:0,rot:Math.random()*6,vr:(Math.random()-.5)*12});}
function burst(e){
  const s=SZ*scl(clamp01(e.y/groundY())),x=ex(e),y=e.y-s*0.6,R=()=>Math.random()-.5,pk=a=>a[Math.random()*a.length|0];
  if(e.type==='pirate')for(let i=0;i<24;i++)part(x,y,R()*s*6,-Math.random()*s*5,null,pk(CONF),1.3,true);
  else if(e.type==='robot')for(let i=0;i<4;i++)part(x,y-s*0.4,R()*s*2,-s*(1.2+Math.random()),'♫','#7bf0ff',1.3,false);
  else if(e.type==='skel')for(let i=0;i<6;i++)part(x,y-s*0.2,R()*s*2.5,-s*(0.8+Math.random()),'✦','#fff3a6',1.0,false);
  else if(e.type==='mummy'){for(let i=0;i<10;i++)part(x,y-s*0.3,R()*s*3,-Math.random()*s*1.5,'●','#e6d2aa',0.9,false);st.fx.push({x,y:y-s*0.6,text:T[lang].sneeze,color:'#fff',t:0,life:1});}
  else if(e.type==='ghost')st.fx.push({flash:true,x,y,s,t:0,life:0.35});
  else if(e.type==='dino')for(let i=0;i<5;i++)part(x,y,R()*s*2,-s*Math.random(),'●','#3f9b3a',0.6,true);
}
function draw(time){
  ctx.save();
  if(st.shake>0)ctx.translate((Math.random()-.5)*st.shake*24,(Math.random()-.5)*st.shake*12);
  drawFloor(time);
  st.marks.forEach(drawMark);
  [...st.ens].sort((a,b)=>a.y-b.y).forEach(drawEnemy);
  drawFog();drawBarrier(time);
  for(const s of st.shots){const e=s.e,p=clamp01(e.y/groundY()),tx=ex(e),ty=e.y-SZ*scl(p)*0.6,sx=W/2,sy=H+10,t=Math.min(1,s.t);
    drawShot(sx+(tx-sx)*t,sy+(ty-sy)*t-Math.sin(t*Math.PI)*SZ*0.6,t,WORLD[e.type].shot);}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of st.fx){ctx.globalAlpha=Math.max(0,1-f.t/f.life);
    if(f.sing){const e=f.e,s=SZ*scl(clamp01(e.y/groundY())),bx=ex(e)+s*0.42,by=e.y-s*1.3,pop=Math.min(1,f.t/0.12)*(1+0.15*Math.sin(f.t*20));
      ctx.save();ctx.translate(bx,by);ctx.scale(pop,pop);ctx.fillStyle='#fff';ell(0,0,s*0.26,s*0.22);ctx.fill();tri(-s*0.16,s*0.12,-s*0.28,s*0.3,-s*0.03,s*0.18);
      ctx.fillStyle='#2b2340';ctx.font=`700 ${s*0.32}px Fredoka, sans-serif`;ctx.fillText('♪',0,s*0.01);ctx.restore();
      ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;circle(ex(e),e.y-s*0.74,s*(0.35+f.t*0.9));ctx.stroke();}
    else if(f.part){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.txt?0:f.rot);ctx.fillStyle=f.col;
      if(f.txt){ctx.font=`700 ${SZ*0.24}px Fredoka, sans-serif`;ctx.fillText(f.txt,0,0);}else ctx.fillRect(-4,-2,8,4);ctx.restore();}
    else if(f.flash){ctx.fillStyle='#fffbe0';circle(f.x,f.y,f.s*(0.6+f.t*3));ctx.fill();}
    else if(f.ring){ctx.strokeStyle='#fff';ctx.lineWidth=3;circle(f.x,f.y,SZ*(0.3+f.t*0.8));ctx.stroke();}
    else{ctx.fillStyle=f.color;ctx.font=`700 ${f.big?26:20}px Fredoka, sans-serif`;ctx.strokeStyle='rgba(30,15,50,.85)';ctx.lineWidth=5;ctx.strokeText(f.text,f.x,f.y-f.t*20);ctx.fillText(f.text,f.x,f.y-f.t*20);}}
  ctx.globalAlpha=1;
  if(st.banner){const b=st.banner,a=b.t<0.3?b.t/0.3:b.t>1.8?Math.max(0,(2.2-b.t)/0.4):1;ctx.globalAlpha=a;
    ctx.font=`${Math.min(56,W/7)}px Creepster, Fredoka, cursive`;ctx.strokeStyle='rgba(20,10,35,.8)';ctx.lineWidth=6;ctx.strokeText(b.text,W/2,H*0.5);ctx.fillStyle='#9be15d';ctx.fillText(b.text,W/2,H*0.5);
    ctx.font='600 19px Fredoka, sans-serif';ctx.strokeText(b.sub,W/2,H*0.5+42);ctx.fillStyle='#f6f0ff';ctx.fillText(b.sub,W/2,H*0.5+42);ctx.globalAlpha=1;}
  ctx.restore();
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(st.running&&!st.paused)update(dt);draw(now/1000);requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ---------- Pantallas ---------- */
function seg(k,opts,base=0){return '<div class="seg">'+opts.map((o,i)=>`<button data-k="${k}" data-v="${i+base}" class="${cfg[k]===i+base?'on':''}">${o}</button>`).join('')+'</div>';}
const GICONS=['🎵','🤝','🎈','🧥','📅'];
const LANGS=[['gl','Galego'],['ca','Català'],['eu','Euskara'],['es','Castellano']];
const langBtn=document.getElementById('langBtn'),gearBtn=document.getElementById('gearBtn'),langPop=document.getElementById('langPop');
let screen='home',prevScreen='home';
function renderLang(){
  langBtn.innerHTML=FLAGS[lang];
  langPop.innerHTML=LANGS.map(([c,n])=>`<button data-l="${c}" class="${c===lang?'on':''}">${FLAGS[c]}${n}</button>`).join('');
  langPop.querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);document.documentElement.lang=lang;langPop.classList.add('hidden');spell();renderLang();hud();refreshKeys();showOverlay(screen);});
}
langBtn.onclick=e=>{e.stopPropagation();langPop.classList.toggle('hidden');};
document.addEventListener('pointerdown',e=>{if(!langPop.contains(e.target)&&e.target!==langBtn&&!langBtn.contains(e.target))langPop.classList.add('hidden');});
gearBtn.onclick=()=>{if(screen!=='settings')prevScreen=screen;showOverlay('settings');};
function toMenu(){st.running=false;st.paused=false;st.ens=[];st.shots=[];st.fx=[];st.marks=[];document.body.classList.remove('ingame');refreshKeys();showOverlay('setup');}
function showOverlay(mode){
  const t=T[lang];let h='<div class="panel">';screen=mode;
  if(mode==='home'){
    h+=`<div class="big">Invasons</div><div class="cards">`+t.gtitles.map((n,i)=>`<button class="card" data-g="${i}" ${i>1?'disabled':''}><span class="ic">${GICONS[i]}</span><span>${n}<small>${i>1?t.soon:t.gdesc[i]}</small></span></button>`).join('')+'</div>';
  }else if(mode==='setup'){
    const g=cfg.game;
    h+=`<div class="top"><button class="back" id="backBtn" aria-label="${t.menu}">‹</button><h2>${GICONS[g]} ${t.gtitles[g]}</h2></div>`;
    h+=`<p class="desc" style="text-align:left;margin:-6px 0 14px">${isIv()?t.ivHint:t.sub}</p>`;
    h+=`<div class="row"><p class="label">${t.theme}</p><div class="strip" id="strip">`+t.themes.map((n,i)=>`<button class="tbtn ${cfg.theme===i?'on':''}" data-k="theme" data-v="${i}"><span>${ICONS[i]}</span>${n}</button>`).join('')+'</div></div>';
    h+=`<div class="row"><p class="label">${t.material}</p>${seg('material',t.mats)}</div>`;
    if(cfg.material===0){
      const tonSel=`<select id="tonSel" aria-label="${t.key}">${TONICS.map((_,i)=>`<option value="${i}" ${i===cfg.tonic?'selected':''}>${tonicName(i)}</option>`).join('')}</select>`;
      h+=`<div class="row"><p class="label">${t.kindLbl}</p>${seg('kind',t.kinds)}</div>`;
      if(cfg.kind===0){
        h+=`<div class="row"><p class="label">${t.key}</p><div class="seg">${tonSel}`+t.mmN.map((n,i)=>`<button data-k="mm" data-v="${i}" class="${cfg.mm===i?'on':''}">${n}</button>`).join('')+'</div></div>';
        h+=`<div class="row"><p class="label">${t.scale}</p>${seg('svar',cfg.mm?t.svm:t.svM)}</div>`;
      }else h+=`<div class="row"><p class="label">${t.key}</p><div class="seg">${tonSel}<select id="modalSel" aria-label="${t.kinds[1]}">${t.modals.map((m,i)=>`<option value="${i}" ${i===cfg.modal?'selected':''}>${m}</option>`).join('')}</select></div></div>`;
    }
    {const lk=isIv()?'ivStart':cfg.material===1?'atStart':'startLevel',labs=isIv()?t.ivLabels:cfg.material===1?t.alabels:t.labels;if(cfg[lk]>=labs.length)cfg[lk]=0;
      h+=`<div class="row"><p class="label">${t.level}</p><div class="lvlrow" style="grid-template-columns:repeat(${labs.length},1fr)">`+labs.map((_,i)=>`<button data-k="${lk}" data-v="${i}" class="${cfg[lk]===i?'on':''}">${i+1}</button>`).join('')+`</div><p class="desc">${labs[cfg[lk]]}</p></div>`;}
    h+=`<button class="play" id="goBtn">${t.play}</button>${best?`<p class="hint">${t.best}: ${best}</p>`:''}`;
  }else if(mode==='settings'){
    h+=`<div class="top"><button class="back" id="closeSet" aria-label="${t.close}">‹</button><h2>⚙ ${t.settings}</h2></div>`;
    h+=`<div class="row"><p class="label">${t.range}</p>${seg('reg',t.ranges,1)}<p class="desc">${t.regHint}</p></div>`;
    h+=`<div class="row"><p class="label">${t.volume}</p><input type="range" class="vol" id="volR" min="0" max="1" step="0.05" value="${volume}"></div>`;
    h+=`<div class="row" style="text-align:left"><label class="toggle"><input type="checkbox" id="nmChk" ${showNames?'checked':''}> ${t.names}</label></div>`;
    h+=`<p class="hint" style="text-align:left">${t.hint}<br>${t.keys}<br>${t.keysIv}</p>`;
  }else if(mode==='pause'){
    h+=`<div class="big" style="font-size:52px">${t.paused}</div><button class="play" id="resBtn">${t.resume}</button><br><button class="ghost" id="menuBtn">${t.menu}</button>`;
  }else{
    h+=`<div class="big" style="font-size:clamp(40px,11vw,60px)">${t.over}</div><div class="score">${st.score}</div><p class="sub">${t.best}: ${best}</p>
    <button class="play" id="goBtn">${t.again}</button><br><button class="ghost" id="menuBtn">${t.menu}</button>`;
  }
  overlay.innerHTML=h+'</div>';overlay.classList.remove('hidden');
  overlay.querySelectorAll('.card:not(:disabled)').forEach(b=>b.onclick=()=>{cfg.game=+b.dataset.g;saveCfg();refreshKeys();hud();showOverlay('setup');});
  overlay.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cfg[b.dataset.k]=+b.dataset.v;saveCfg();spell();refreshKeys();hud();const sl=document.getElementById('strip')?.scrollLeft;showOverlay(screen);const s2=document.getElementById('strip');if(s2&&sl!=null)s2.scrollLeft=sl;});
  const strip=document.getElementById('strip');if(strip&&!strip.dataset.init){const on=strip.querySelector('.on');if(on)strip.scrollLeft=on.offsetLeft-strip.clientWidth/2+on.clientWidth/2;}
  const ts=overlay.querySelector('#tonSel');if(ts)ts.onchange=()=>{cfg.tonic=+ts.value;saveCfg();spell();refreshKeys();hud();};
  const ms=overlay.querySelector('#modalSel');if(ms)ms.onchange=()=>{cfg.modal=+ms.value;saveCfg();spell();refreshKeys();hud();};
  const nm=overlay.querySelector('#nmChk');if(nm)nm.onchange=()=>{showNames=nm.checked;store.set('names',showNames);refreshKeys();};
  const vr=overlay.querySelector('#volR');if(vr)vr.oninput=()=>{volume=+vr.value;store.set('vol',volume);if(master)master.gain.value=volume;ensureAudio();playNote(69,0.2,0.4);};
  const go=overlay.querySelector('#goBtn');if(go)go.onclick=startGame;
  const bk=overlay.querySelector('#backBtn');if(bk)bk.onclick=()=>showOverlay('home');
  const cs=overlay.querySelector('#closeSet');if(cs)cs.onclick=()=>showOverlay(prevScreen==='settings'?'home':prevScreen);
  const rs=overlay.querySelector('#resBtn');if(rs)rs.onclick=togglePause;
  const mn=overlay.querySelector('#menuBtn');if(mn)mn.onclick=toMenu;
}
document.documentElement.lang=lang;
renderLang();
spell();buildKeyboard();hud();showOverlay('home');
})();
</script>
